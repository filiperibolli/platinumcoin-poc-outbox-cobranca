# O cenário do Main É a saída do programa, e o handshake SSH do sshj — uma
# dezena de linhas INFO por transmissão — a afogaria. Aviso para cima continua
# aparecendo: uma falha de conexão não pode ficar silenciosa.
org.slf4j.simpleLogger.log.net.schmizz=warn

# O download do step-09 herda InMemoryDestFile do sshj, e o logger que a
# biblioteca usa lá dentro é o da NOSSA subclasse — três linhas INFO de
# permissões e timestamps por arquivo baixado, com o nome do nosso pacote.
# A linha acima não as alcança; esta alcança, e só a elas.
org.slf4j.simpleLogger.log.com.platinumcoin.outbox.infra.canal.CanalArquivosSftp$Recebido=warn
