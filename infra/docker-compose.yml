# Sobe o ambiente completo com `docker compose -f infra/docker-compose.yml up`.
# Zero passo manual: o schema e a fila são criados pelos scripts de init.
name: ciclo-de-cobranca

services:

  postgres:
    image: postgres:16-alpine
    container_name: ciclo-postgres
    environment:
      POSTGRES_DB: cobranca
      POSTGRES_USER: cobranca
      POSTGRES_PASSWORD: cobranca
    ports:
      - "5432:5432"
    volumes:
      # O MESMO arquivo que os testes aplicam via Testcontainers.
      # DECISÃO: uma única fonte de verdade para o schema — ver docs/steps/step-01.md
      - ./init/02-postgres.sql:/docker-entrypoint-initdb.d/02-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobranca -d cobranca"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    container_name: ciclo-localstack
    environment:
      # Teto de infra do projeto: Postgres + dois serviços AWS.
      SERVICES: sqs,s3
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      # ready.d roda depois que o LocalStack está de pé.
      - ./init/01-localstack.sh:/etc/localstack/init/ready.d/01-localstack.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 && awslocal s3 ls s3://cobranca-artefatos >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # O parceiro: um servidor SFTP de verdade, com os dois diretórios do ciclo.
  # A sintaxe `usuario:senha:::dirs` do atmoz/sftp cria /remessa e /retorno
  # dentro do chroot do usuário — do lado do cliente eles são a raiz.
  sftp:
    image: atmoz/sftp:alpine
    container_name: ciclo-sftp
    command: parceiro:parceiro:::remessa,retorno
    ports:
      - "2222:22"

  # A aplicação. Fica atrás do perfil `app` de propósito: `up -d` sem perfil
  # sobe só o ambiente, que é o que o `mvn spring-boot:run` do dia a dia
  # precisa — e as duas formas disputariam a porta 8080 se ambas subissem.
  # Com o perfil, os logs dos quatro processos saem no mesmo lugar.
  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: ciclo-de-cobranca:local
    container_name: ciclo-app
    environment:
      # Os mesmos nomes que o Ambiente lê; só os endereços mudam, porque de
      # dentro da rede do Compose o vizinho é o nome do serviço, não localhost.
      DB_URL: jdbc:postgresql://postgres:5432/cobranca
      SQS_ENDPOINT: http://localstack:4566
      S3_ENDPOINT: http://localstack:4566
      SFTP_HOST: sftp
      SFTP_PORTA: "22"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      sftp:
        condition: service_started
